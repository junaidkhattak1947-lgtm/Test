name: Build Zero Studio APK
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Extract Android project
        run: unzip -q ZeroStudioAndroid-Project-Updated.zip -d project
      - name: Build debug APK
        working-directory: project/ZeroStudioAndroid
        run: gradle --no-daemon assembleDebug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Zero-Studio-debug-APK
          path: project/ZeroStudioAndroid/app/build/outputs/apk/debug/app-debug.apk
